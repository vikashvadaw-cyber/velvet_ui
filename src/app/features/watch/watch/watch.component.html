<div
  class="player-wrapper"
  #playerWrapper
  (mousemove)="onMouseMove()"
  (mouseleave)="onMouseLeave()"
  [class.controls-hidden]="!showControls() && isPlaying()"
>
  <video
    #videoEl
    class="video-el"
    [src]="activeSrc"
    (click)="togglePlay()"
    (dblclick)="toggleFullscreen()"
    (play)="isPlaying.set(true)"
    (pause)="isPlaying.set(false)"
    (loadedmetadata)="onLoadedMetadata()"
    (timeupdate)="onTimeUpdate()"
    (progress)="onProgress()"
    (waiting)="isLoading.set(true)"
    (playing)="isLoading.set(false)"
    (ended)="onEnded()"
    autoplay
  ></video>

  <div class="loading-spinner" *ngIf="isLoading()">
    <span class="spinner"></span>
  </div>

  <button
    class="center-play"
    *ngIf="!isPlaying() && !isLoading()"
    (click)="togglePlay()"
    aria-label="Play"
  >
    <i class="ti ti-player-play-filled"></i>
  </button>

  <div class="top-bar">
    <button class="icon-btn" (click)="goBack()" aria-label="Back">
      <i class="ti ti-chevron-left"></i>
    </button>
    <span class="now-playing">{{ currentMovie().title }}</span>
  </div>

  <div class="controls-bar">
    <div class="progress-track" #progressTrack (click)="seekTo($event)">
      <div class="progress-buffered" [style.width.%]="bufferedPercent"></div>
      <div class="progress-fill" [style.width.%]="progressPercent"></div>
      <div class="progress-scrubber" [style.left.%]="progressPercent"></div>
    </div>

    <div class="controls-row">
      <div class="controls-left">
        <button class="icon-btn" (click)="goPrev()" aria-label="Previous">
          <i class="ti ti-player-skip-back"></i>
        </button>
        <button
          class="icon-btn"
          (click)="togglePlay()"
          [attr.aria-label]="isPlaying() ? 'Pause' : 'Play'"
        >
          <i
            class="ti"
            [ngClass]="
              isPlaying() ? 'ti-player-pause-filled' : 'ti-player-play-filled'
            "
          ></i>
        </button>
        <button class="icon-btn" (click)="goNext()" aria-label="Next">
          <i class="ti ti-player-skip-forward"></i>
        </button>
        <button
          class="icon-btn"
          (click)="seekBy(-10)"
          aria-label="Back 10 seconds"
        >
          <i class="ti ti-rewind-backward-10"></i>
        </button>
        <button
          class="icon-btn"
          (click)="seekBy(10)"
          aria-label="Forward 10 seconds"
        >
          <i class="ti ti-rewind-forward-10"></i>
        </button>

        <div class="volume-group">
          <button
            class="icon-btn"
            (click)="toggleMute()"
            [attr.aria-label]="isMuted() ? 'Unmute' : 'Mute'"
          >
            <i
              class="ti"
              [ngClass]="
                isMuted() || volume() === 0
                  ? 'ti-volume-3'
                  : volume() < 0.5
                    ? 'ti-volume-2'
                    : 'ti-volume'
              "
            ></i>
          </button>
          <input
            type="range"
            class="volume-slider"
            min="0"
            max="1"
            step="0.05"
            [value]="isMuted() ? 0 : volume()"
            (input)="onVolumeChange($event)"
            aria-label="Volume"
          />
        </div>

        <span class="time-display"
          >{{ formatTime(currentTime()) }} / {{ formatTime(duration()) }}</span
        >
      </div>

      <div class="controls-right">
        <div class="dropdown">
          <button
            class="icon-btn text-btn"
            (click)="
              showSpeedMenu.set(!showSpeedMenu()); showQualityMenu.set(false)
            "
          >
            {{ playbackRate() }}x
          </button>
          <div class="dropdown-menu" *ngIf="showSpeedMenu()">
            <button
              *ngFor="let rate of speedOptions"
              class="dropdown-item"
              [class.active]="rate === playbackRate()"
              (click)="setSpeed(rate)"
            >
              {{ rate }}x
            </button>
          </div>
        </div>

        <div class="dropdown">
          <button
            class="icon-btn text-btn"
            (click)="
              showQualityMenu.set(!showQualityMenu()); showSpeedMenu.set(false)
            "
          >
            {{ selectedQuality() }}
          </button>
          <div class="dropdown-menu" *ngIf="showQualityMenu()">
            <button
              *ngFor="let q of currentMovie().qualities"
              class="dropdown-item"
              [class.active]="q.label === selectedQuality()"
              (click)="setQuality(q.label)"
            >
              {{ q.label }}
            </button>
          </div>
        </div>

        <button
          class="icon-btn"
          (click)="togglePip()"
          aria-label="Picture in picture"
        >
          <i class="ti ti-picture-in-picture"></i>
        </button>
        <button
          class="icon-btn"
          (click)="toggleFullscreen()"
          [attr.aria-label]="isFullscreen() ? 'Exit fullscreen' : 'Fullscreen'"
        >
          <i
            class="ti"
            [ngClass]="
              isFullscreen() ? 'ti-arrows-minimize' : 'ti-arrows-maximize'
            "
          ></i>
        </button>
      </div>
    </div>
  </div>
</div>
